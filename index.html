<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who's Leading Standup?</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="theme-toggle" class="btn btn-icon btn-secondary theme-toggle" type="button" aria-label="Switch to dark mode">🌙</button>

  <main class="page">
    <div class="eyebrow">Morning Standup</div>
    <h1>Who's Leading Standup?</h1>
    <hr class="hr">

    <div class="team-row">
      <div class="field">
        <label for="team-select">Team</label>
        <select id="team-select" class="input"></select>
      </div>
      <button id="manage-team-btn" class="btn btn-secondary" type="button">Manage Team</button>
    </div>

    <div class="roll-row">
      <div class="die-wrap">
        <div id="die" class="die">
          <div id="die-solid" class="die-solid"></div>
        </div>
      </div>
      <div class="result">
        <div id="status-label" class="eyebrow">Press roll</div>
        <div id="result-text" class="result-text">—</div>
      </div>
    </div>

    <div class="actions">
      <button id="roll-btn" class="btn btn-primary" type="button">Roll the dice</button>
      <p id="empty-hint" class="hint text-muted hidden">Add at least one name to this team to roll.</p>
    </div>

    <div class="roster-block">
      <div class="eyebrow">Members</div>
      <div id="roster-list" class="chip-row"></div>
    </div>
  </main>

  <div id="manage-modal" class="dialog-backdrop hidden">
    <div class="dialog">
      <div class="dialog-title">Manage Team</div>

      <div class="field">
        <label for="team-name-input">Team name</label>
        <input id="team-name-input" class="input" type="text" placeholder="e.g. Platform Team" />
      </div>

      <div class="field">
        <label for="name-input">Add a name</label>
        <div class="add-name-row">
          <input id="name-input" class="input" type="text" placeholder="e.g. Alex" />
          <button id="add-name-btn" class="btn btn-secondary" type="button">Add</button>
        </div>
      </div>

      <ul id="modal-name-list" class="modal-name-list"></ul>

      <div class="dialog-actions">
        <button id="cancel-team-btn" class="btn btn-secondary" type="button">Cancel</button>
        <button id="save-team-btn" class="btn btn-primary" type="button">Save Team</button>
      </div>
    </div>
  </div>

  <script src="teams.js"></script>
  <script src="app.js"></script>
</body>
</html>
