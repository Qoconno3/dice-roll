<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standup Leader Picker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>🎲 Standup Leader Picker</h1>
      <p class="subtitle">Roll the dice to pick who leads today's standup</p>
    </header>

    <section class="team-bar">
      <label for="team-select">Team</label>
      <select id="team-select"></select>
      <button id="new-team-btn" class="btn btn-secondary">New Team</button>
      <button id="manage-team-btn" class="btn btn-secondary">Manage Names</button>
      <button id="delete-team-btn" class="btn btn-danger">Delete Team</button>
    </section>

    <section class="dice-area">
      <div id="die" class="die">
        <span id="die-face">?</span>
      </div>
      <button id="roll-btn" class="btn btn-primary">Roll the Dice</button>
      <p id="empty-hint" class="hint hidden">Add at least one name to this team to roll.</p>
    </section>

    <section class="roster">
      <h2>Current Team Members</h2>
      <ul id="roster-list" class="roster-list"></ul>
    </section>
  </div>

  <div id="manage-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="manage-title">Manage Names</h2>

      <label for="team-name-input">Team name</label>
      <input id="team-name-input" type="text" placeholder="e.g. Platform Team" />

      <label for="name-input">Add a name</label>
      <div class="add-name-row">
        <input id="name-input" type="text" placeholder="e.g. Alex" />
        <button id="add-name-btn" class="btn btn-secondary">Add</button>
      </div>

      <ul id="modal-name-list" class="modal-name-list"></ul>

      <div class="modal-actions">
        <button id="save-team-btn" class="btn btn-primary">Save Team</button>
        <button id="cancel-team-btn" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
